<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subjects - School Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; color: #333; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: #2c3e50; color: white; padding: 1rem 2rem; }
        header h1 { font-size: 1.5rem; }
        nav { background: #34495e; display: flex; gap: 1rem; padding: 0.75rem 2rem; flex-wrap: wrap; }
        nav a { color: white; text-decoration: none; padding: 0.5rem 1rem; border-radius: 4px; transition: background 0.2s; }
        nav a:hover, nav a.active { background: #1abc9c; }
        main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
        .container { max-width: 800px; width: 100%; background: white; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); overflow: hidden; }
        .form-section { padding: 1.5rem 2rem; border-bottom: 1px solid #eee; }
        .form-section h2 { margin-bottom: 1rem; color: #2c3e50; font-size: 1.1rem; }
        .form-row { display: flex; gap: 1rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
        .form-row input, .form-row button { padding: 0.6rem 1rem; border: 1px solid #ddd; border-radius: 4px; font-size: 0.95rem; }
        .form-row input { flex: 1; min-width: 150px; }
        .form-row button { background: #1abc9c; color: white; border: none; cursor: pointer; }
        .form-row button:hover { background: #16a085; }
        .table-section { padding: 1.5rem 2rem; }
        .table-section h2 { margin-bottom: 1rem; color: #2c3e50; font-size: 1.1rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #555; font-weight: 600; }
        tr:hover { background: #fafbfc; }
        .actions button { margin-right: 0.5rem; padding: 0.35rem 0.75rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .btn-edit { background: #3498db; color: white; }
        .btn-delete { background: #e74c3c; color: white; }
        footer { text-align: center; padding: 1rem; color: #999; font-size: 0.85rem; }
    </style>
</head>
<body>
    <header><h1>School Management System</h1></header>
    <nav>
        <a href="students.html">Students</a>
        <a href="subjects.html" class="active">Subjects</a>
        <a href="courses.html">Courses</a>
        <a href="enrolment.html">Enrolment</a>
    </nav>

    <main>
        <div class="container">
            <div class="form-section">
                <h2 id="formTitle">Add Subject</h2>
                <input type="hidden" id="subjectId">
                <div class="form-row">
                    <input type="text" id="subjectCode" placeholder="Subject Code">
                    <input type="text" id="subjectName" placeholder="Subject Name">
                </div>
                <div class="form-row">
                    <input type="text" id="subjectDesc" placeholder="Description (optional)">
                </div>
                <div class="form-row">
                    <button onclick="saveSubject()">Save Subject</button>
                    <button onclick="resetForm()" style="background:#95a5a6;">Cancel</button>
                </div>
            </div>

            <div class="table-section">
                <h2>Subjects</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="subjectsTable"></tbody>
                </table>
            </div>
        </div>
    </main>

    <footer>School Management System &copy; 2026</footer>

    <!-- Hard-wired per SubjectEndpoint_Instructions.md – do not modify. -->
    <script>
        // Page-specific JS: hard-wired CRUD against the Subjects API (/api/subjects)
        // (Self-contained; the courses-only api.js is intentionally not loaded on this page.)
        const SUBJECTS_API_BASE = '/api/subjects';

        /** Load all subjects and populate the table */
        async function loadSubjects() {
            try {
                const res = await fetch(SUBJECTS_API_BASE);
                if (!res.ok) throw new Error(`Failed to load subjects: ${res.status}`);
                const subjects = await res.json();
                populateSubjectsTable(subjects);
            } catch (err) {
                console.error(err);
                alert(err.message);
            }
        }

        /** Render a table of subjects */
        function populateSubjectsTable(subjects) {
            const tbody = document.getElementById('subjectsTable');
            tbody.innerHTML = '';
            subjects.forEach(s => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                  <td>${s.id}</td>
                  <td>${s.code}</td>
                  <td>${s.name}</td>
                  <td>${s.description ?? ''}</td>
                  <td class="actions">
                    <button class="btn-edit" onclick="editSubject(${s.id})">Edit</button>
                    <button class="btn-delete" onclick="deleteSubject(${s.id})">Delete</button>
                  </td>`;
                tbody.appendChild(tr);
            });
        }

        /** Read form values into a DTO */
        function getSubjectFormValues() {
            return {
                code: document.getElementById('subjectCode').value.trim(),
                name: document.getElementById('subjectName').value.trim(),
                description: document.getElementById('subjectDesc').value.trim(),
            };
        }

        /** Simple validation */
        function validateSubject(values) {
            if (!values.code || !values.name) {
                alert('Code and Name are required.');
                return false;
            }
            return true;
        }

        /** Save (create or update) a subject */
        async function saveSubject() {
            const id = document.getElementById('subjectId').value;
            const dto = getSubjectFormValues();
            if (!validateSubject(dto)) return;

            try {
                const method = id ? 'PUT' : 'POST';
                const url = id ? `${SUBJECTS_API_BASE}/${id}` : SUBJECTS_API_BASE;
                const body = id ? { id: parseInt(id, 10), ...dto } : dto;
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || `Error ${res.status}`);
                }
                alert(`Subject ${id ? 'updated' : 'created'} successfully.`);
                resetForm();
                loadSubjects();
            } catch (err) {
                console.error(err);
                alert(err.message);
            }
        }

        /** Load a single subject for editing */
        async function editSubject(id) {
            try {
                const res = await fetch(`${SUBJECTS_API_BASE}/${id}`);
                if (!res.ok) throw new Error(`Subject not found`);
                const s = await res.json();
                document.getElementById('subjectId').value = s.id;
                document.getElementById('subjectCode').value = s.code;
                document.getElementById('subjectName').value = s.name;
                document.getElementById('subjectDesc').value = s.description ?? '';
                document.getElementById('formTitle').textContent = 'Edit Subject';
            } catch (err) {
                console.error(err);
                alert(err.message);
            }
        }

        /** Delete a subject */
        async function deleteSubject(id) {
            if (!confirm('Delete this subject?')) return;
            try {
                const res = await fetch(`${SUBJECTS_API_BASE}/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(`Failed to delete: ${res.status}`);
                alert('Subject deleted.');
                loadSubjects();
            } catch (err) {
                console.error(err);
                alert(err.message);
            }
        }

        /** Reset form to add mode */
        function resetForm() {
            document.getElementById('subjectId').value = '';
            document.getElementById('subjectCode').value = '';
            document.getElementById('subjectName').value = '';
            document.getElementById('subjectDesc').value = '';
            document.getElementById('formTitle').textContent = 'Add Subject';
        }

        // Load subjects on page load
        window.addEventListener('DOMContentLoaded', loadSubjects);
    </script>
</body>
</html>
